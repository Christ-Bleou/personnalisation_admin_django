{% extends "admin/base_site.html" %}
{% load admin_charts %}
{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        {% for config in chart_configs %}
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white"><h5>{{ config.title }}</h5></div>
                <div class="card-body"><canvas id="chart-{{ config.id }}"></canvas></div>
            </div>
            <script>
            document.addEventListener("DOMContentLoaded", function() {
                const ctx = document.getElementById("chart-{{ config.id }}").getContext("2d");
                new Chart(ctx, { type: "{{ config.chart_type }}", data: {% get_chart_data config %} });
            });
            </script>
        {% endfor %}
    </div>
</div>
{% endblock %}
