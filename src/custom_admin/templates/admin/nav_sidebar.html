{% load i18n %}
<div class="bg-dark border-right vh-100 p-3" id="sidebar-wrapper" style="min-width: 250px;">
    <div class="sidebar-heading text-white mb-4">
        <h4 class="fw-bold"><i class="fas fa-shield-alt me-2"></i>Admin Panel</h4>
    </div>
    <div class="list-group list-group-flush">
        <a href="{% url 'admin:index' %}" class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="fas fa-tachometer-alt me-2"></i> {% trans 'Dashboard' %}
        </a>
        
        {% for app in available_apps %}
            <div class="mt-3 mb-1 text-uppercase text-secondary small fw-bold">
                {{ app.name }}
            </div>
            {% for model in app.models %}
                <a href="{{ model.admin_url }}" class="list-group-item list-group-item-action bg-dark text-white border-0 ps-4">
                    <i class="fas fa-chevron-right small me-2" style="font-size: 0.7em;"></i>
                    {{ model.name }}
                </a>
            {% endfor %}
        {% endfor %}
    </div>
</div>

<style>
    #nav-sidebar { display: none; } /* On cache la sidebar par défaut de Django */
    #content { width: 100%; }
    .list-group-item:hover { background-color: #3d444b !important; color: #0d6efd !important; }
</style>
